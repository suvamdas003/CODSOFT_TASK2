# Reverse proxy in front of the Next.js server.
#
# Security role: it OVERWRITES X-Forwarded-For with the address of the client
# that connected to it. The app (and Better Auth's login rate limiter) key on
# that header, so clients can no longer forge it to dodge rate limits.

server_tokens off;

upstream dinedesk_app {
    server app:3000;
    keepalive 16;
}

server {
    listen 8080;
    listen [::]:8080;

    client_max_body_size 1m;

    location / {
        proxy_pass http://dinedesk_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # $http_host keeps the port, which Next.js server actions compare with the Origin header.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
